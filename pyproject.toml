[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clip-generator"
version = "0.1.0"
description = "Find loud, high-energy moments in a video and cut clips."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pre-commit"]

[project.scripts]
clipgen = "clip_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clip_generator"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
